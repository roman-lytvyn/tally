<!DOCTYPE html>
<html>
<head>
  <!-- No <base> tag: every file is looked up next to this page, so the app
       runs from whatever folder it is served from. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Deberc score counter">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#111118" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">

  <!-- Installing to the home screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Deberc">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Deberc</title>
  <!-- The app's own background while it loads, instead of a white flash. -->
  <style>
    html, body { margin: 0; height: 100%; background: #F2F2F7; }
    @media (prefers-color-scheme: dark) { html, body { background: #111118; } }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
