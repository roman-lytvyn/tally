stages:
  - lint
  - test
  - build
  - tag
  - deploy

include:
  - local: devops/apps/ci.yml

variables:
  FLUTTER_IMAGE: ghcr.io/cirruslabs/flutter:stable
  GIT_DEPTH: 1

workflow:
  rules:
    # Pushing a version tag only records the version; publishing is driven by
    # creating a release, so tag pushes create no pipeline of their own.
    - if: $CI_COMMIT_TAG && $CI_PIPELINE_SOURCE != "web"
      when: never
    # While a branch has a merge request open, the merge request pipeline
    # already covers its commits, so skip the branch pipeline for the same code.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - when: always

.flutter:
  image: $FLUTTER_IMAGE
  cache:
    key:
      files:
        - pubspec.lock
    paths:
      - .pub-cache
  before_script:
    - export PUB_CACHE="$CI_PROJECT_DIR/.pub-cache"
    - flutter pub get

# ── Lint ─────────────────────────────────────────────────────────────────────

analyze:
  extends: .flutter
  stage: lint
  rules:
    # A release pipeline ships a build that already passed this stage.
    - if: $RELEASE_DEPLOY
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - flutter analyze

# ── Test ─────────────────────────────────────────────────────────────────────

test:
  extends: .flutter
  stage: test
  rules:
    - if: $RELEASE_DEPLOY
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - dart pub global activate junitreport > /dev/null
    - export PATH="$PATH:$PUB_CACHE/bin"
    # The machine-readable run feeds the test report; --coverage writes lcov.
    - flutter test --coverage --machine | tojunit --output report.xml
    - |
      # Turn lcov into the single percentage GitLab reads from the log and shows
      # on the pipeline and in the merge request coverage widget.
      awk -F: '/^LF:/ {found += $2} /^LH:/ {hit += $2} END {
        printf "All files | %.2f\n", found ? hit * 100 / found : 0
      }' coverage/lcov.info
  coverage: '/All files \| ([\d.]+)/'
  artifacts:
    # Collected on failure too: a failing run is when the report is worth having.
    when: always
    reports:
      junit: report.xml

# ── Build ────────────────────────────────────────────────────────────────────
# Android and Linux build here: Windows needs a Windows runner and the iPhone
# and Mac apps a macOS runner, and this cluster has neither. The apps of the
# family and the jobs' per-app switch are in devops/apps/ci.yml.

.android-build:
  extends: [.flutter, .each-app]
  variables:
    # Every app of the matrix builds in its own job at the same time. Asking the
    # cluster for the memory a build really uses lets the scheduler spread these
    # jobs over the nodes, and the limit stops a runaway build on its own.
    KUBERNETES_MEMORY_REQUEST: 4Gi
    KUBERNETES_MEMORY_LIMIT: 6Gi
  script:
    # Gradle in CI keeps within the job's memory limit: a 3 GB heap, and the
    # Kotlin compiler inside the Gradle process instead of a second JVM. The
    # user-level gradle.properties takes precedence over android/gradle.properties,
    # which stays sized for development machines.
    - mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}"
    - |
      cat > "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties" <<PROPS
      org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m
      kotlin.compiler.execution.strategy=in-process
      org.gradle.workers.max=2
      PROPS
    - !reference [.use-app, script]
    # Play needs a version code that only ever grows; the pipeline number is
    # exactly that, and the version name matches the tag the release carries.
    # A release pipeline passes the published tag in as VERSION, so the built
    # package is named for the released version; a normal build derives its own.
    - VERSION=${VERSION:-$(date +%Y.%m).${CI_PIPELINE_IID}}
    - echo "VERSION=$VERSION" > build.env
    # Signing details arrive as CI/CD variables. Without them Gradle falls back
    # to the debug key, which is fine for a download link but not for Play.
    - |
      if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
        cat > android/key.properties <<PROPS
      storeFile=../upload-keystore.jks
      storePassword=$ANDROID_KEYSTORE_PASSWORD
      keyAlias=$ANDROID_KEY_ALIAS
      keyPassword=$ANDROID_KEY_PASSWORD
      PROPS
        echo "Building signed with the upload key"
      else
        echo "No upload key configured, building with the debug key: not publishable to Play"
      fi
    - flutter build apk --release --build-name="$VERSION" --build-number="$CI_PIPELINE_IID" --dart-define=GAME="$APP_GAME" --dart-define=APP_VERSION="$VERSION"
    - flutter build appbundle --release --build-name="$VERSION" --build-number="$CI_PIPELINE_IID" --dart-define=GAME="$APP_GAME" --dart-define=APP_VERSION="$VERSION"
    - mv build/app/outputs/flutter-apk/app-release.apk "$APP_FILE_NAME-$VERSION.apk"
    - mv build/app/outputs/bundle/release/app-release.aab "$APP_FILE_NAME-$VERSION.aab"
    - rm -f android/key.properties android/upload-keystore.jks

build:
  extends: .android-build
  stage: build
  rules:
    - if: $RELEASE_DEPLOY
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
  artifacts:
    paths:
      - "*.apk"
      - "*.aab"
    reports:
      dotenv: build.env

# The Linux desktop build is packed into a .deb that installs the app with its
# menu entry and icon. The Flutter image carries no desktop toolchain, so the
# compiler and GTK headers are installed first.
.linux-build:
  extends: [.flutter, .each-app]
  script:
    - !reference [.use-app, script]
    - VERSION=${VERSION:-$(date +%Y.%m).${CI_PIPELINE_IID}}
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev > /dev/null
    - flutter build linux --release --build-name="$VERSION" --build-number="$CI_PIPELINE_IID" --dart-define=GAME="$APP_GAME" --dart-define=APP_VERSION="$VERSION"
    - sh devops/linux/build-deb.sh "$VERSION" "$APP_FILE_NAME-$VERSION.deb" "$APP"

build-linux:
  extends: .linux-build
  stage: build
  rules:
    - if: $RELEASE_DEPLOY
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    # A merge request that touches the Linux app or the build checks it still packs.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - linux/**/*
        - devops/**/*
  artifacts:
    paths:
      - "*.deb"

# The web app is packed into a .zip the website serves as it is. It is built
# for WebAssembly with the engine files inside the app, and the fonts the engine
# falls back to are put next to it, so it loads nothing from other hosts.
.web-build:
  extends: [.flutter, .each-app]
  script:
    - !reference [.use-app, script]
    - VERSION=${VERSION:-$(date +%Y.%m).${CI_PIPELINE_IID}}
    - flutter build web --release --wasm --no-web-resources-cdn --build-name="$VERSION" --build-number="$CI_PIPELINE_IID" --dart-define=GAME="$APP_GAME" --dart-define=APP_VERSION="$VERSION"
    - dart run devops/web/fallback_fonts.dart build/web/fonts
    # Debug symbols are of no use to a browser, and web/sw.js takes the place of
    # Flutter's own service worker.
    - find build/web -name '*.symbols' -delete
    - rm -f build/web/flutter_service_worker.js
    - command -v zip > /dev/null || (apt-get update -qq && apt-get install -y -qq zip > /dev/null)
    - (cd build/web && zip -qr "$CI_PROJECT_DIR/$APP_FILE_NAME-$VERSION-web.zip" .)

build-web:
  extends: .web-build
  stage: build
  rules:
    - if: $RELEASE_DEPLOY
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    # A merge request that touches the web app or the build checks it still builds.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - web/**/*
        - devops/**/*
  artifacts:
    paths:
      - "*-web.zip"

# The GitLab Runner service runs under its own account, so a Flutter that was
# added to a user's PATH is invisible to it. This puts Flutter on PATH for the
# job from FLUTTER_HOME or a handful of common install folders, and fails with
# a clear message if it cannot be found.
.find-flutter:
  script:
    - |
      if (-not (Get-Command flutter -ErrorAction SilentlyContinue)) {
        $roots = @()
        if ($env:FLUTTER_HOME) { $roots += $env:FLUTTER_HOME }
        $roots += @("C:\flutter", "C:\src\flutter", "$env:USERPROFILE\flutter", "$env:LOCALAPPDATA\flutter", "C:\tools\flutter", "C:\dev\flutter")
        $bin = $roots | ForEach-Object { Join-Path $_ "bin" } | Where-Object { Test-Path (Join-Path $_ "flutter.bat") } | Select-Object -First 1
        if ($bin) {
          $env:PATH = "$bin;$env:PATH"
          Write-Host "Using Flutter at $bin"
        } else {
          Write-Host "Flutter was not found on this runner. Add its bin folder to the machine PATH and restart the GitLab Runner service, or set a FLUTTER_HOME CI/CD variable pointing to the Flutter folder."
          exit 1
        }
      }
    - |
      # Flutter runs git inside its own SDK folder to read the engine version.
      # When the runner service account differs from the folder's owner, git
      # refuses until the folder is marked safe; register it once for this account.
      $sdk = ((Split-Path (Get-Command flutter).Source -Parent | Split-Path -Parent) -replace '\\', '/')
      if (((git config --global --get-all safe.directory) 2>$null) -notcontains $sdk) {
        git config --global --add safe.directory $sdk
      }
    - flutter --version

# The Windows build runs on a self-hosted Windows runner tagged "windows":
# building for Windows needs the Windows toolchain, which a Linux runner cannot
# provide. The runner keeps its own Flutter and pub cache between jobs.
.windows-build:
  extends: .each-app
  tags:
    - windows
  variables:
    PUB_CACHE: $CI_PROJECT_DIR\.pub-cache
  before_script:
    - !reference [.find-flutter, script]
    - flutter pub get

# The same switch as .use-app, for the Windows runner's PowerShell; the app's
# identity lands in $app.
.use-app-windows:
  script:
    - dart run devops/apps/use_app.dart "$env:APP"
    - . devops\apps\profile.ps1
    - $app = Read-AppProfile $env:APP

build-windows:
  extends: .windows-build
  stage: build
  rules:
    - if: $RELEASE_DEPLOY
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    # A merge request that touches the Windows app or the build checks it still
    # builds and packs.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - windows/**/*
        - devops/**/*
  script:
    - $ErrorActionPreference = "Stop"
    - $VERSION = "$(Get-Date -Format yyyy.MM).$env:CI_PIPELINE_IID"
    # An MSIX version is four dot-separated numbers with no leading zeros, so the
    # padded month in $VERSION is reparsed as plain integers and a fourth part
    # is appended.
    - $MSIX_VERSION = (($VERSION.Split('.') | ForEach-Object { [int]$_ }) -join '.') + '.0'
    - !reference [.use-app-windows, script]
    - flutter build windows --release --build-name="$VERSION" --build-number="$env:CI_PIPELINE_IID" --dart-define=GAME="$($app.APP_GAME)" --dart-define=APP_VERSION="$VERSION"
    # A self-signed .msix, installable for smoke-testing the Windows build. The
    # Store-signed package is produced only when a release is published.
    # --install-certificate false keeps the test certificate out of the machine
    # trust store, which also avoids the interactive prompt that would hang CI.
    - dart run msix:create --output-path . --output-name "$($app.APP_FILE_NAME)-$VERSION" --version "$MSIX_VERSION" --install-certificate false
    # The per-user setup.exe that the website offers for download.
    - devops\windows\build-installer.ps1 "$VERSION" . "$env:APP"
    # The same app as a .zip that runs where it is unpacked.
    - devops\windows\build-zip.ps1 "$VERSION" . "$env:APP"
  artifacts:
    paths:
      - "*.msix"
      - "*-setup.exe"
      - "*-windows.zip"

# ── Tag ──────────────────────────────────────────────────────────────────────
# Tags every build that passed, so a release is picked from a list of
# known-good versions instead of typed by hand.

tag:
  stage: tag
  image:
    name: alpine/git:latest
    entrypoint: [""]
  rules:
    - if: $RELEASE_DEPLOY
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - build
  script:
    # CI_JOB_TOKEN cannot write to the repository, so push over HTTPS with a
    # project access token that carries the write_repository scope.
    - git remote set-url origin "https://oauth2:${TAG_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - |
      if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null 2>&1; then
        echo "Tag $VERSION already exists, nothing to do"
        exit 0
      fi
    - git tag "$VERSION" "$CI_COMMIT_SHA"
    - git push origin "refs/tags/$VERSION"

# ── Deploy ───────────────────────────────────────────────────────────────────
# Creating a release is what publishes a version: a release webhook starts this
# pipeline with RELEASE_DEPLOY set. The published version is read back from the
# Releases API, the tag is rebuilt, and the result is attached to the release
# and sent to Play.

release-version:
  stage: tag
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" && $RELEASE_DEPLOY == "true"
  script:
    - apk add --no-cache curl jq > /dev/null
    - |
      # A release webhook carries no version, so the released version is the tag
      # of the most recently created release: the one just published.
      curl -sf -H "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases?per_page=1&order_by=created_at&sort=desc" > releases.json
      VERSION=$(jq -r '.[0].tag_name // empty' releases.json)
      if [ -z "$VERSION" ]; then
        # Deleting a release also reaches this pipeline; there is simply
        # nothing to publish then.
        echo "No release to publish"
      else
        echo "Publishing released version $VERSION"
      fi
      echo "VERSION=$VERSION" > release.env
  artifacts:
    reports:
      dotenv: release.env

# The tag is built again rather than reusing the artifact from main: artifacts
# belong to the pipeline that made them, and a tag has no pipeline of its own.
publish:
  extends: .android-build
  stage: deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" && $RELEASE_DEPLOY == "true"
  variables:
    GIT_DEPTH: 0
  environment:
    name: google-play
    url: https://play.google.com/store/apps/details?id=app.tallycards.deberc
  before_script:
    - |
      if [ -z "$VERSION" ]; then
        echo "Nothing to publish"
        exit 0
      fi
    - git checkout "$VERSION"
    - export PUB_CACHE="$CI_PROJECT_DIR/.pub-cache"
    - flutter pub get
  after_script:
    - |
      [ -z "$VERSION" ] && exit 0
      . "devops/apps/$APP.env"
      apk="$APP_FILE_NAME-$VERSION.apk"
      [ -f "$apk" ] || exit 0
      # Attach the build to the release so it can be downloaded from there.
      url="$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/raw/$apk"
      curl -sf -X POST -H "PRIVATE-TOKEN: $TAG_PUSH_TOKEN" \
        --data-urlencode "name=$apk" --data-urlencode "url=$url" \
        --data-urlencode "link_type=package" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$VERSION/assets/links" > /dev/null \
        && echo "Attached $apk to release $VERSION" \
        || echo "Could not attach $apk to release $VERSION"
  artifacts:
    paths:
      - "*.apk"
      - "*.aab"

# The released tag is packed for Linux and the .deb attached to the release,
# next to the Android and Windows builds.
publish-linux:
  extends: .linux-build
  stage: deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" && $RELEASE_DEPLOY == "true"
  variables:
    GIT_DEPTH: 0
  needs:
    - release-version
  before_script:
    - |
      if [ -z "$VERSION" ]; then
        echo "Nothing to publish"
        exit 0
      fi
    - git checkout "$VERSION"
    - export PUB_CACHE="$CI_PROJECT_DIR/.pub-cache"
    - flutter pub get
  after_script:
    - |
      [ -z "$VERSION" ] && exit 0
      . "devops/apps/$APP.env"
      deb="$APP_FILE_NAME-$VERSION.deb"
      [ -f "$deb" ] || exit 0
      url="$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/raw/$deb"
      curl -sf -X POST -H "PRIVATE-TOKEN: $TAG_PUSH_TOKEN" \
        --data-urlencode "name=$deb" --data-urlencode "url=$url" \
        --data-urlencode "link_type=package" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$VERSION/assets/links" > /dev/null \
        && echo "Attached $deb to release $VERSION" \
        || echo "Could not attach $deb to release $VERSION"
  artifacts:
    paths:
      - "*.deb"

# The released tag is built for the web and the .zip attached to the release,
# for the website to serve as the online version of the app.
publish-web:
  extends: .web-build
  stage: deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" && $RELEASE_DEPLOY == "true"
  variables:
    GIT_DEPTH: 0
  needs:
    - release-version
  before_script:
    - |
      if [ -z "$VERSION" ]; then
        echo "Nothing to publish"
        exit 0
      fi
    - git checkout "$VERSION"
    - export PUB_CACHE="$CI_PROJECT_DIR/.pub-cache"
    - flutter pub get
  after_script:
    - |
      [ -z "$VERSION" ] && exit 0
      . "devops/apps/$APP.env"
      zip="$APP_FILE_NAME-$VERSION-web.zip"
      [ -f "$zip" ] || exit 0
      url="$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/raw/$zip"
      curl -sf -X POST -H "PRIVATE-TOKEN: $TAG_PUSH_TOKEN" \
        --data-urlencode "name=$zip" --data-urlencode "url=$url" \
        --data-urlencode "link_type=package" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$VERSION/assets/links" > /dev/null \
        && echo "Attached $zip to release $VERSION" \
        || echo "Could not attach $zip to release $VERSION"
  artifacts:
    paths:
      - "*-web.zip"

# The iPhone and Mac apps build on a self-hosted macOS runner tagged "macos",
# as only Xcode on macOS builds them. That machine is not always on, so before
# building, apple-runner asks GitLab whether the runner has been in touch in
# the last few minutes, and only then does apple start devops/apple/ci.yml as a
# child pipeline; otherwise the Apple builds are skipped. Either way the rest
# of the pipeline neither waits for the Apple builds nor fails because of them.
# RUNNER_CHECK_TOKEN is a project access token with the read_api scope.
.apple-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" && $RELEASE_DEPLOY == "true"
      variables:
        APPLE_MODE: release
    - if: $RELEASE_DEPLOY
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        APPLE_MODE: check
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ios/**/*
        - macos/**/*
        - devops/**/*
      variables:
        APPLE_MODE: check

apple-runner:
  extends: .apple-rules
  stage: deploy
  image: alpine:3.20
  allow_failure: true
  needs:
    - job: release-version
      optional: true
  variables:
    # The runner counts as online when it asked for work this recently.
    RUNNER_FRESH_SECONDS: 300
  script:
    - apk add --no-cache curl jq > /dev/null
    - sh devops/apple/runner-online.sh && online=yes || online=""
    - |
      if [ -n "$online" ]; then
        echo "Starting the iPhone and Mac builds ($APPLE_MODE)"
        printf 'include:\n  - local: devops/apple/ci.yml\nvariables:\n  APPLE_MODE: "%s"\n  VERSION: "%s"\n' "$APPLE_MODE" "$VERSION" > apple.yml
      else
        echo "The macOS runner is off: skipping the iPhone and Mac builds"
        cp devops/apple/skipped.yml apple.yml
      fi
  artifacts:
    paths:
      - apple.yml

apple:
  extends: .apple-rules
  stage: deploy
  allow_failure: true
  needs:
    - apple-runner
  trigger:
    include:
      - artifact: apple.yml
        job: apple-runner

# The website offers the files of the latest release and serves its web app,
# so once they are attached it is rebuilt with this release and goes live with it.
website:
  stage: deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" && $RELEASE_DEPLOY == "true"
  needs:
    - release-version
    - publish
    - publish-linux
    - publish-web
    - publish-windows
  inherit:
    variables: false
  variables:
    APP_RELEASE: $VERSION
  trigger:
    project: games/tally-site
    branch: main

# Runs only once Play credentials exist, so the rest of the pipeline works
# without them. One service account uploads every app that has a Play listing,
# APP_GOOGLE_PLAY in its profile, to that listing's closed testing track and
# sends it to Google review; testers get it as soon as Google approves it. The
# "Changes" list of the GitLab release becomes the "What's new" text. Listing
# texts, screenshots and icons are edited by hand in the Play Console.
google-play:
  extends: .each-app
  stage: deploy
  image: ruby:3.3-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" && $RELEASE_DEPLOY == "true" && $GOOGLE_PLAY_SERVICE_ACCOUNT
  needs:
    - release-version
    - publish
  environment:
    name: google-play
    url: https://play.google.com/store/apps/details?id=app.tallycards.deberc
  script:
    - |
      if [ -z "$VERSION" ]; then
        echo "Nothing to publish"
        exit 0
      fi
    - . "devops/apps/$APP.env"
    - |
      if [ "$APP_GOOGLE_PLAY" != "true" ]; then
        echo "$APP_NAME has no Play listing yet"
        exit 0
      fi
    - apk add --no-cache build-base curl jq > /dev/null && gem install --silent fastlane
    - |
      # The bullet list under "Changes" in the release description, without the
      # heading and the Downloads section; Play allows 500 characters.
      notes=play-metadata/en-US/changelogs
      mkdir -p "$notes"
      curl -sf -H "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$VERSION" \
        | jq -r '.description // ""' | tr -d '\r' \
        | awk '/^\*\*Changes\*\*/ { on = 1; next } /^\*\*/ { on = 0 } on && NF' \
        | head -c 500 > "$notes/default.txt" || true
      [ -s "$notes/default.txt" ] || echo "Bug fixes and improvements." > "$notes/default.txt"
      cat "$notes/default.txt"
    - echo "$GOOGLE_PLAY_SERVICE_ACCOUNT" > play-account.json
    - |
      fastlane run upload_to_play_store \
        json_key:play-account.json \
        package_name:"$APP_PACKAGE_ID" \
        aab:"$APP_FILE_NAME-$VERSION.aab" \
        skip_upload_apk:true \
        track:alpha \
        release_status:completed \
        metadata_path:play-metadata \
        skip_upload_changelogs:false \
        skip_upload_metadata:true \
        skip_upload_images:true \
        skip_upload_screenshots:true
    - rm -f play-account.json

# The tag is rebuilt on Windows the same way it is on Linux for Android: a tag
# has no pipeline of its own, so the release pipeline checks the tag out and
# builds it. Every app with APP_MS_STORE set carries the identity Partner Center
# reserved for it in its own profile; the publisher shared by all of them comes
# from the MSIX_PUBLISHER CI/CD variable. An app without a Store listing gets a
# self-signed package.
publish-windows:
  extends: .windows-build
  stage: deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" && $RELEASE_DEPLOY == "true"
  variables:
    GIT_DEPTH: 0
    PUB_CACHE: $CI_PROJECT_DIR\.pub-cache
  needs:
    - release-version
  environment:
    name: microsoft-store
    url: https://apps.microsoft.com/detail/deberc
  before_script:
    - $ErrorActionPreference = "Stop"
    - if (-not $env:VERSION) { Write-Host "Nothing to publish"; exit 0 }
    - git checkout "$env:VERSION"
    - !reference [.find-flutter, script]
    - flutter pub get
  script:
    - if (-not $env:VERSION) { exit 0 }
    - !reference [.use-app-windows, script]
    - flutter build windows --release --build-name="$env:VERSION" --build-number="$env:CI_PIPELINE_IID" --dart-define=GAME="$($app.APP_GAME)" --dart-define=APP_VERSION="$env:VERSION"
    # Always produce a downloadable package to attach to the release. When a
    # Store publisher identity is configured, build the variant the Store signs
    # (--store plus the identity reserved in Partner Center); otherwise a
    # self-signed package, enough to download and install for smoke-testing.
    - |
      # MSIX versions carry no leading zeros, so the padded month in the tag is
      # reparsed as plain integers and a fourth part is appended.
      $msixVersion = (($env:VERSION.Split('.') | ForEach-Object { [int]$_ }) -join '.') + '.0'
      $args = @(
        "run", "msix:create",
        "--output-path", ".",
        "--output-name", "$($app.APP_FILE_NAME)-$env:VERSION",
        "--version", $msixVersion
      )
      if ($env:MSIX_PUBLISHER -and $app.APP_MS_STORE -eq "true") {
        $args += @("--store", "--publisher", $env:MSIX_PUBLISHER, "--identity-name", $app.APP_MS_IDENTITY_NAME)
        if ($env:MSIX_PUBLISHER_DISPLAY_NAME){ $args += @("--publisher-display-name", $env:MSIX_PUBLISHER_DISPLAY_NAME) }
        # The Store accepts a package only under a name reserved for the app.
        if ($app.APP_MS_STORE_NAME)          { $args += @("--display-name", $app.APP_MS_STORE_NAME) }
      } else {
        # --install-certificate false keeps the test certificate out of the
        # machine trust store and avoids the interactive prompt that hangs CI.
        $args += @("--install-certificate", "false")
      }
      dart @args
    # The per-user setup.exe that the website offers for download.
    - devops\windows\build-installer.ps1 "$env:VERSION" . "$env:APP"
    # The same app as a .zip that runs where it is unpacked.
    - devops\windows\build-zip.ps1 "$env:VERSION" . "$env:APP"
  after_script:
    # Attach the Windows installer, archive and package to the release next to
    # the Android build.
    - |
      if (-not $env:VERSION) { exit 0 }
      . devops\apps\profile.ps1
      $name = (Read-AppProfile $env:APP).APP_FILE_NAME
      foreach ($file in @("$name-$env:VERSION-setup.exe", "$name-$env:VERSION-windows.zip", "$name-$env:VERSION.msix")) {
        if (-not (Test-Path $file)) { continue }
        $url = "$env:CI_PROJECT_URL/-/jobs/$env:CI_JOB_ID/artifacts/raw/$file"
        try {
          Invoke-RestMethod -Method Post -Uri "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/releases/$env:VERSION/assets/links" `
            -Headers @{ "PRIVATE-TOKEN" = $env:TAG_PUSH_TOKEN } `
            -Body @{ name = $file; url = $url; link_type = "package" } | Out-Null
          Write-Host "Attached $file to release $env:VERSION"
        } catch {
          Write-Host "Could not attach $file to release $env:VERSION"
        }
      }
  artifacts:
    paths:
      - "*.msix"
      - "*-setup.exe"
      - "*-windows.zip"

# Submits the Store package of every app with a Store listing to Partner Center
# for certification; the update goes live as soon as Microsoft certifies it.
# Runs only once MS_STORE_SUBMIT is switched on, which needs the Entra
# application behind the MS_* credentials to hold the Manager role in Partner
# Center. Listing texts, screenshots and icons are edited by hand there.
microsoft-store:
  extends: .windows-build
  stage: deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" && $RELEASE_DEPLOY == "true" && $MS_STORE_SUBMIT == "true"
  needs:
    - release-version
    - publish-windows
  before_script: []
  variables:
    MSSTORE_CLI_URL: https://github.com/microsoft/msstore-cli/releases/download/v0.4.4/MSStoreCLI-win-x64.zip
    MSSTORE_CLI_SHA256: D288A324541DC68244A683EB5B6445E9239BB47D1E6ACF5CCA4D1476017F1447
  environment:
    name: microsoft-store
    url: https://apps.microsoft.com/detail/deberc
  script:
    - $ErrorActionPreference = "Stop"
    - if (-not $env:VERSION) { Write-Host "Nothing to submit"; exit 0 }
    - . devops\apps\profile.ps1
    - $app = Read-AppProfile $env:APP
    - if ($app.APP_MS_STORE -ne "true") { Write-Host "$($app.APP_NAME) has no Store listing yet"; exit 0 }
    # Microsoft Store Developer CLI from its official release, checksum-pinned.
    - $cliDir = Join-Path $env:TEMP "msstore-cli-$env:CI_JOB_ID"
    - New-Item -ItemType Directory -Force $cliDir | Out-Null
    - '[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12'
    - Invoke-WebRequest -UseBasicParsing $env:MSSTORE_CLI_URL -OutFile "$cliDir\cli.zip"
    - if ((Get-FileHash "$cliDir\cli.zip" -Algorithm SHA256).Hash -ne $env:MSSTORE_CLI_SHA256) { throw "Microsoft Store CLI checksum mismatch" }
    - Expand-Archive "$cliDir\cli.zip" -DestinationPath $cliDir -Force
    - $env:PATH = "$cliDir;$env:PATH"
    - msstore reconfigure --tenantId $env:MS_TENANT_ID --clientId $env:MS_CLIENT_ID --clientSecret $env:MS_CLIENT_SECRET --sellerId $env:MS_SELLER_ID
    # Creates a submission from the last published one, swaps in the new
    # package and submits it for certification.
    - msstore publish "$($app.APP_FILE_NAME)-$env:VERSION.msix" --appId $app.APP_MS_STORE_ID
